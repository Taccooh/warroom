# Standalone example: pulls the published image and exposes it on the host.
# Put a TLS-terminating reverse proxy in front for real use (see README) —
# push notifications and geolocation require HTTPS.
#
# To build from source instead of pulling, replace `image: ...` with `build: .`.
services:
  warroom:
    image: ghcr.io/taccooh/warroom:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - WARROOM_VAPID_SUB=mailto:you@example.com
      # Cap on enemy cells handed to the planner. The default covers the largest
      # turf we know of; raise it if the log says "planner limit ... reached",
      # because the cut runs by difficulty and drops the HARDEST cells first.
      # - WARROOM_PLANNER_LIMIT=25000
      # - WARROOM_MAX_USERS=30
      # Minutes a gang's team totals and member list are reused before they are
      # fetched again (the slowest call of a poll cycle). 0 = every cycle.
      # - WARROOM_TEAM_MINUTES=30
      # - WARROOM_TZ=Europe/Berlin
      # Cell ownership log (which gang held which cell, for the map time-lapse).
      # On by default and not backfillable; 0 switches it off.
      # - WARROOM_CELL_LOG=1
      # White rabbits and bounties on the map and in the planner (two extra
      # requests per cycle); a new rabbit within this many km of a player's
      # cells is announced by push. 0 switches either off.
      # - WARROOM_GAME_EXTRAS=1
      # - WARROOM_RABBIT_KM=50
      # Free OpenSky API client (opensky-network.org, account page, "API client"): the
      # worldwide air traffic picture then refreshes every 2 minutes instead of every 16.
      # - WARROOM_OPENSKY_ID=...
      # - WARROOM_OPENSKY_SECRET=...
